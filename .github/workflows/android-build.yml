name: Android CI and Signed APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build updateable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Validate NAS signing script syntax
        run: bash -n tools/nas-signing-setup.sh

      - name: Unit tests and compilation check
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      # PRs only run the tests. Never expose private signing secrets to PR code.
      - name: Validate and restore stable signing key
        if: github.event_name != 'pull_request'
        env:
          PSR_KEYSTORE_BASE64: ${{ secrets.PSR_KEYSTORE_BASE64 }}
          PSR_KEYSTORE_PASSWORD: ${{ secrets.PSR_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$PSR_KEYSTORE_BASE64" || -z "$PSR_KEYSTORE_PASSWORD" ]]; then
            echo "::error title=Signing setup required::GitHub Secrets PSR_KEYSTORE_BASE64 and PSR_KEYSTORE_PASSWORD are missing. Run tools/setup-signing.ps1 once on Windows."
            exit 1
          fi
          umask 077
          printf '%s' "$PSR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pokesleeprater-release.jks"
          test -s "$RUNNER_TEMP/pokesleeprater-release.jks"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/pokesleeprater-release.jks" -storepass "$PSR_KEYSTORE_PASSWORD" -alias pokesleeprater >/dev/null

      - name: Build signed updateable release APK
        if: github.event_name != 'pull_request'
        env:
          PSR_SIGNING_FILE: ${{ runner.temp }}/pokesleeprater-release.jks
          PSR_SIGNING_PASSWORD: ${{ secrets.PSR_KEYSTORE_PASSWORD }}
        run: |
          CI_VERSION_CODE=$(( 1000 + GITHUB_RUN_NUMBER ))
          echo "Building stable-signed APK with versionCode=$CI_VERSION_CODE"
          gradle --no-daemon --stacktrace :app:assembleRelease "-PciVersionCode=$CI_VERSION_CODE"

      - name: Verify release signature and pinned certificate
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_CERT_SHA256: ${{ vars.PSR_SIGNING_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          VERIFY_OUTPUT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          echo "$VERIFY_OUTPUT"
          ACTUAL=$(printf '%s\n' "$VERIFY_OUTPUT" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([A-Fa-f0-9]+).*$/\1/p' | head -n 1 | tr 'A-F' 'a-f')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          if [[ -z "$EXPECTED" || -z "$ACTUAL" || "$EXPECTED" != "$ACTUAL" ]]; then
            echo "::error title=Signing certificate mismatch::The signed APK certificate differs from PSR_SIGNING_CERT_SHA256, or signing is not initialized."
            exit 1
          fi
          echo "Signing certificate matches the pinned fingerprint."

      - name: Upload signed APK (install this one)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: PokeSleepRater-signed-update-v0.4.0-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PokeSleepRater-unit-test-results-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pokesleeprater-release.jks"

      - name: Build summary
        if: success() && github.event_name != 'pull_request'
        run: |
          {
            echo '## PokeSleepRater stable-signed update'
            echo '- Tests: passed'
            echo '- Signed release APK: passed verification'
            echo '- Application ID: dev.automationse.pokesleeprater (unchanged)'
            echo "- versionCode: $(( 1000 + GITHUB_RUN_NUMBER ))"
            echo '- Download **PokeSleepRater-signed-update-...** from Artifacts.'
            echo '- Future releases signed by the same keystore can update in place.'
          } >> "$GITHUB_STEP_SUMMARY"
